name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Third-party actions are pinned to a commit, not a tag a maintainer can move. Dependabot proposes updates.
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Every entry point loads from the built package
        run: node scripts/smoke.mjs
      - name: The command line runs
        run: node bin/assay.mjs --version && printf 'a real sentence in the source text' > /tmp/s.txt && node bin/assay.mjs quotes --source /tmp/s.txt --quote 'a real sentence in the source' && (env -u COURTLISTENER_TOKEN node bin/assay.mjs legal /tmp/s.txt || test $? -eq 2)
      - name: The site builds from the real code (its examples assert what the page says); titles, descriptions, share tags, structured data, links and the sitemap are checked
        run: node site/build.mjs && node site/check.mjs
      - name: The committed site is the one the build produces (Cloudflare serves site/public as it is, with no build step)
        if: matrix.node == 22
        run: git diff --exit-code -- site/public && test -z "$(git status --porcelain -- site/public)"
